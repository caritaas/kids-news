  <script type="application/json" id="week-data">{"weekId":"2026-10-30","rangeLabel":"2026년 10월 26~30일","tracks":[{"id":"g3","grade":3,"paper":"어린이동아","label":"3학년","articles":[{"id":"d1","title":"한글 점자에 담긴 따뜻한 마음","date":"2026-10-26","url":"https://kids.donga.com/news/articleView.html?idxno=170131","summary":"박두성 선생은 시각장애 학생들이 우리말로 공부할 수 있도록 한글 점자를 만들었어요. 1926년에 완성한 ‘훈맹정음’은 여섯 점을 이용해 한글을 나타내요. 선생은 점자책을 포개 놓지 말고 책장에 세워 두라고 당부했어요. 책의 무게에 눌려 도드라진 점이 평평해지면 손끝으로 읽기 어려워지기 때문이에요. 이 기사는 어린이기자가 선생의 추모식에 참여하며 배운 내용을 전해요.","keywords":[{"word":"점자","meaning":"손끝으로 도드라진 점을 만져 읽는 문자"},{"word":"추모","meaning":"세상을 떠난 사람을 기억하고 그리워함"}]},{"id":"d2","title":"“고라니가 나타났어요!” 로드킬 막는 AI의 눈","date":"2026-10-29","url":"https://kids.donga.com/news/articleView.html?idxno=170158","summary":"도로에 나온 동물을 차가 치는 사고를 로드킬이라고 해요. 동물뿐 아니라 운전자도 다칠 수 있어요. 이를 줄이려고 CCTV 영상에서 야생동물을 찾아내는 AI 시스템을 시험하고 있어요. AI가 동물을 발견하면 경광등과 전광판으로 운전자에게 알려 속도를 줄이도록 도와요. 여러 지역에서 시험한 뒤 청주로 운영 장소를 넓혔으며, 앞으로 실제 사고가 얼마나 줄었는지도 살필 계획이에요.","keywords":[{"word":"경광등","meaning":"빛을 깜빡여 위험을 알리는 등"},{"word":"시범 운영","meaning":"효과나 문제점을 알아보려고 먼저 시험해 운영함"}]},{"id":"d3","title":"한국 첫 ‘우주 청소 위성’, 로봇팔 달고 내년 출동","date":"2026-10-28","url":"https://kids.donga.com/news/articleView.html?idxno=170144","summary":"임무가 끝난 위성이나 로켓 조각이 우주를 떠돌면 다른 위성과 부딪힐 수 있어요. 우리나라는 이런 우주쓰레기를 붙잡는 위성을 준비하고 있어요. 2027년에 발사해 로봇팔로 목표물을 잡고, 낮은 곳으로 옮겨 대기권에서 타 없어지게 하는 기술을 시험할 계획이에요. 우주에 남은 물체를 안전하게 다루려는 도전이지요. 아직 우주에서 시험하지 않았으므로 성공했다고 말할 수는 없어요.","keywords":[{"word":"임무","meaning":"맡아서 해야 하는 일"},{"word":"대기권","meaning":"지구를 둘러싸고 있는 공기의 층"}]}],"questions":[{"id":"g3q1","articleId":"d1","type":"mcq","skill":"내용 이해","prompt":"박두성 선생이 점자책을 책장에 세워 두라고 한 까닭은 무엇인가요?","options":["도드라진 점이 눌리지 않도록 하려고","책의 표지를 모두 가리려고","책을 더 무겁게 만들려고","읽은 날짜를 기억하려고"],"answer":0,"explanation":"점이 납작해지면 손끝으로 글자를 구별하기 어려워요. 점의 모양을 지키는 보관법이에요."},{"id":"g3q2","articleId":"d1","type":"mcq","skill":"어휘 이해","prompt":"‘점자’를 가장 잘 설명한 것은 무엇인가요?","options":["색깔만 보고 읽는 그림","도드라진 점을 손끝으로 만져 읽는 문자","소리를 크게 내는 기계","책의 순서를 알려 주는 숫자"],"answer":1,"explanation":"눈으로 인쇄된 글자를 보는 방식과 달리, 점자는 손끝으로 점의 모양을 느껴 읽어요."},{"id":"g3q3","articleId":"d1","type":"written","skill":"이유 설명","prompt":"친구가 점자책 위에 무거운 책을 올리려 해요. 어떻게 보관하면 좋을지와 그 이유를 한두 문장으로 알려 주세요.","sampleAnswer":"점자책은 책장에 세워 두자. 무거운 책에 눌려 점이 납작해지면 손끝으로 읽기 어려워지기 때문이야.","rubric":["점이 눌리지 않게 보관하는 방법을 제시했나요?","도드라진 점과 손끝으로 읽는 일을 연결해 이유를 썼나요?"]},{"id":"g3q4","articleId":"d2","type":"mcq","skill":"순서 파악","prompt":"AI 로드킬 예방 시스템의 작동 순서로 알맞은 것은 무엇인가요?","options":["운전자가 내린다 → 동물을 잡는다 → CCTV를 켠다","전광판이 꺼진다 → 차가 빨라진다 → 동물이 나온다","CCTV가 찍는다 → AI가 동물을 찾는다 → 위험을 알린다","AI가 동물을 옮긴다 → 도로를 닫는다 → 신호를 보낸다"],"answer":2,"explanation":"영상에서 동물을 알아본 뒤 빛과 안내 문구로 운전자에게 알려요. AI가 직접 동물을 옮기는 장치는 아니에요."},{"id":"g3q5","articleId":"d2","type":"mcq","skill":"어휘 이해","prompt":"기사의 ‘시범 운영’은 어떤 뜻인가요?","options":["모든 도로에 설치를 마쳤다는 뜻","잘되는지 먼저 시험해 본다는 뜻","사고가 다시는 생기지 않는다는 뜻","사용을 영원히 그만둔다는 뜻"],"answer":1,"explanation":"효과와 문제점을 먼저 살피는 단계예요. 사고 감소도 확인할 예정이에요."},{"id":"g3q6","articleId":"d2","type":"written","skill":"핵심 정리","prompt":"이 시스템이 동물과 운전자를 어떻게 도울 수 있는지 한두 문장으로 써 보세요.","sampleAnswer":"동물이 나타났다는 것을 미리 알려 운전자가 속도를 줄이게 해요. 그러면 동물과 차가 부딪힐 위험을 줄일 수 있어요.","rubric":["위험을 미리 알리는 기능을 설명했나요?","동물과 운전자 모두의 안전을 생각했나요?"]},{"id":"g3q7","articleId":"d3","type":"mcq","skill":"내용 이해","prompt":"기사에서 말하는 ‘우주쓰레기’에 해당하는 것은 무엇인가요?","options":["땅에 버린 음식물","아직 열심히 일하는 모든 위성","임무가 끝난 위성과 로켓 조각","밤하늘에서 빛나는 모든 별"],"answer":2,"explanation":"할 일을 마친 인공 물체나 조각이 우주에 남아 떠도는 것을 가리켜요."},{"id":"g3q8","articleId":"d3","type":"mcq","skill":"사실과 계획","prompt":"이 기사를 읽은 뒤 할 수 있는 말로 알맞은 것은 무엇인가요?","options":["우주쓰레기는 모두 사라졌어요.","새 위성이 이미 모든 시험에 성공했어요.","우주쓰레기는 다른 위성과 부딪힐 수 없어요.","우주쓰레기를 잡는 기술을 앞으로 시험할 계획이에요."],"answer":3,"explanation":"준비와 발사 계획을 전하는 기사예요. 앞으로 할 시험을 이미 성공한 일처럼 말하면 안 돼요."},{"id":"g3q9","articleId":"d3","type":"written","skill":"근거 말하기","prompt":"우주를 청소하는 일이 왜 필요할까요? 기사에서 알게 된 위험을 한 가지 넣어 써 보세요.","sampleAnswer":"우주쓰레기가 일하는 위성과 부딪히면 피해가 날 수 있어요. 이런 위험을 줄이려면 쓰레기를 안전하게 처리할 필요가 있어요.","rubric":["위성과 충돌할 수 있다는 위험을 근거로 들었나요?","그 위험과 청소의 필요성을 연결했나요?"]},{"id":"g3q10","type":"written","skill":"기사 연결","prompt":"점자와 AI 로드킬 예방 시스템은 각각 누구를 어떻게 도와주나요? 두 기사를 연결해 두 문장으로 써 보세요.","sampleAnswer":"점자는 시각장애인이 손끝으로 글을 읽도록 도와줘요. AI 시스템은 운전자에게 동물이 나타났다고 알려 사람과 동물의 안전을 도와줘요.","rubric":["두 기사에서 도움을 받는 대상을 각각 밝혔나요?","각각 어떤 방법으로 돕는지 기사 내용과 맞게 설명했나요?"]}]},{"id":"g5","grade":5,"paper":"어린이조선일보","label":"5학년","articles":[{"id":"c1","title":"유튜브가 오디오북 시장에 뛰어든대요!","date":"2026-10-27","url":"https://www.chosun.com/kid/kid_nie/kid_lower-grades/2026/10/27/BNGLYVKALRAVBKRTMB6X7I4N5U/","summary":"오디오북은 책 내용을 음성으로 들려주는 콘텐츠예요. 이동하거나 집안일을 하면서도 들을 수 있어 이용이 늘고 있지요. 기사에 따르면 유튜브는 출판사와 함께 오디오북 기능을 개발하며 다음 해 출시를 목표로 삼았어요. 정식 서비스가 생기면 유튜브는 새로운 수익을, 출판사는 독자에게 책을 전할 유통 경로를 얻을 수 있어요. 개발 계획과 실제 출시 완료는 구별해서 읽어야 해요.","keywords":[{"word":"유통","meaning":"상품이나 콘텐츠가 만들어진 곳에서 이용자에게 전달되는 과정"},{"word":"청취","meaning":"방송이나 이야기 등의 소리를 들음"}]},{"id":"c2","title":"숏폼에 지친 사람들… 이젠 ‘롱폼’ 영상 찾아요","date":"2026-10-27","url":"https://www.chosun.com/kid/kid_national/kid_thought/2026/10/27/W2IF56TCSBC5HJK4VFBEIIW4XU/","summary":"짧게 편집한 영상뿐 아니라 긴 이야기와 음악을 찾는 사람도 있어요. 기사는 수 시간짜리 역사 영상과 한 시간 넘는 예능, 오래 듣는 음악을 사례로 들어요. 한 음반에는 건너뛰기 기능 없이 열 곡을 차례로 듣게 하는 재생기도 담겼어요. 평론가는 짧고 강한 자극에 지친 사람들이 진지한 감상을 원한다고 해석했어요. 사례로 확인되는 내용과 사람의 해석을 나누어 읽어 보세요.","keywords":[{"word":"롱폼","meaning":"긴 시간에 걸쳐 내용이나 이야기를 이어 가는 형태의 콘텐츠"},{"word":"해석","meaning":"어떤 일의 뜻이나 까닭을 자신의 관점에서 풀어 설명함"}]},{"id":"c3","title":"기후변화 때문에 단풍 들기 전 우수수… ‘조기 낙엽’ 현상 나타난대요","date":"2026-10-29","url":"https://www.chosun.com/kid/kid_environment/2026/10/29/CYV3SUGTDZC7FMT7VTBZSWONM4/","summary":"나무는 보통 가을에 잎의 색이 변한 뒤 잎을 떨궈요. 그런데 폭염과 가뭄으로 물이 모자라면 단풍이 들기 전에 잎이 떨어지기도 해요. 나무는 먼저 잎 표면의 기공을 닫아 수분이 빠져나가는 양을 줄이고, 부족이 계속되면 잎을 떨어뜨려요. 너무 일찍 낙엽이 진 뒤 새잎이 나면 저장한 영양분을 쓰게 돼 겨울을 견디고 봄에 자라는 데 부담이 생길 수 있다고 기사는 설명해요.","keywords":[{"word":"기공","meaning":"식물 잎 표면에서 기체와 수증기가 드나드는 작은 구멍"},{"word":"비축","meaning":"나중에 쓰려고 미리 모아 둠"}]}],"questions":[{"id":"g5q1","articleId":"c1","type":"mcq","skill":"정보 구분","prompt":"오디오북 기사에서 확인할 수 있는 정보는 무엇인가요?","options":["유튜브의 오디오북 서비스가 전 세계에 이미 출시됐어요.","유튜브가 출판사와 기능을 개발하며 출시를 목표로 삼았어요.","오디오북은 책의 글자를 화면으로만 보여 줘요.","출판사는 오디오북을 통해 책을 전할 수 없어요."],"answer":1,"explanation":"개발 중인 계획이에요. 이미 출시됐다고 말하면 정보가 달라져요."},{"id":"g5q2","articleId":"c1","type":"mcq","skill":"원인과 결과","prompt":"정식 오디오북 서비스가 출판사에 이익이 될 수 있는 이유는 무엇인가요?","options":["책을 이용자에게 전할 경로가 늘어나기 때문이에요.","모든 종이책 판매가 금지되기 때문이에요.","독자가 내용을 들을 수 없게 되기 때문이에요.","책의 내용을 만들 필요가 사라지기 때문이에요."],"answer":0,"explanation":"유통 경로가 생기면 더 많은 이용자에게 책을 소개할 기회가 생겨요."},{"id":"g5q3","articleId":"c1","type":"written","skill":"근거 있는 의견","prompt":"오디오북을 이용할 상황과 장점을 연결해 두세 문장으로 써 보세요.","sampleAnswer":"부모님과 이동할 때 이야기를 듣고 싶어요. 책을 계속 펼쳐 들고 있지 않아도 내용을 들을 수 있다는 장점을 활용할 수 있기 때문이에요.","rubric":["이용할 상황을 구체적으로 정했나요?","소리로 듣는 장점과 연결했나요? 타당한 다른 의견도 인정해요."]},{"id":"g5q4","articleId":"c2","type":"mcq","skill":"사실과 의견","prompt":"요약에서 확인되는 사실은 무엇인가요?","options":["긴 영상은 누구에게나 가장 재미있다.","짧은 영상은 모두 볼 가치가 없다.","모든 사람은 긴 음악만 들어야 한다.","건너뛰기 없이 열 곡을 순서대로 듣는 재생기가 소개됐다."],"answer":3,"explanation":"재생기 기능은 확인 가능한 정보예요. 나머지는 평가하거나 요구하는 의견이에요."},{"id":"g5q5","articleId":"c2","type":"mcq","skill":"관점 이해","prompt":"평론가의 해석으로 알맞은 것은 무엇인가요?","options":["긴 콘텐츠가 법으로 의무화돼 인기를 얻었다.","세상에서 짧은 영상이 모두 사라졌다.","짧고 강한 자극에 피로를 느껴 진지한 감상을 원하는 사람이 있다.","모든 음악 재생기에는 건너뛰기 버튼이 없다."],"answer":2,"explanation":"평론가의 해석이에요. 모든 이용자의 이유를 확인한 사실과는 구별해요."},{"id":"g5q6","articleId":"c2","type":"written","skill":"기획과 설명","prompt":"긴 콘텐츠를 만든다면 주제와 순서를 어떻게 정할까요? 길게 만드는 이유도 쓰세요.","sampleAnswer":"씨앗을 심고 싹과 잎이 자라는 과정을 보여 주고 싶어요. 짧은 장면에서는 놓치는 변화를 설명할 수 있기 때문이에요.","rubric":["주제와 순서를 정했나요?","긴 형식의 이점을 설명했나요? 타당한 다른 아이디어도 인정해요."]},{"id":"g5q7","articleId":"c3","type":"mcq","skill":"원인과 결과","prompt":"계속 물이 부족할 때 나무의 반응 순서는 무엇인가요?","options":["기공 닫기 → 잎 떨어뜨리기","기공 열기 → 수분 손실 늘리기","뿌리 없애기 → 잎 늘리기","잎 늘리기 → 수분 손실 늘리기"],"answer":0,"explanation":"기공을 닫고도 부족이 계속되면 잎을 떨어뜨려 수분 손실을 줄여요."},{"id":"g5q8","articleId":"c3","type":"mcq","skill":"설명 연결","prompt":"조기 낙엽 뒤 새잎이 나면 왜 부담이 될까요?","options":["땅속의 물이 반드시 넘쳐요.","새잎에 비축한 영양분을 써요.","새잎에는 영양분이 필요 없어요.","모든 나무가 즉시 두꺼워져요."],"answer":1,"explanation":"겨울과 봄을 위해 저장한 영양분을 새잎에 사용하기 때문이에요."},{"id":"g5q9","articleId":"c3","type":"written","skill":"인과 설명","prompt":"폭염·가뭄과 조기 낙엽을 ‘때문에’나 ‘그래서’로 연결해 설명하세요.","sampleAnswer":"폭염과 가뭄 때문에 물이 모자라요. 그래서 나무는 기공을 닫고, 부족이 계속되면 단풍 전에 잎을 떨어뜨려요.","rubric":["폭염·가뭄과 물 부족을 연결했나요?","물 부족과 나무의 반응을 순서대로 설명했나요?"]},{"id":"g5q10","type":"written","skill":"읽기 점검","prompt":"이번 주 세 기사에서 하나를 골라, 확인된 내용 한 가지와 아직 더 알아보고 싶은 질문 한 가지를 써 보세요. 어느 기사인지도 밝혀 주세요.","sampleAnswer":"오디오북 기사를 골랐어요. 유튜브가 오디오북 기능을 개발하며 출시를 목표로 했다는 내용을 확인했어요. 실제 서비스가 시작되면 어떤 책을 들을 수 있을지 더 알고 싶어요.","rubric":["선택한 기사의 내용을 정확히 한 가지 정리했나요?","기사가 다룬 내용과 관련된 추가 질문을 만들었나요? 타당한 다른 질문도 인정해요."]}]}]}</script>

  (function(){

    function add(parent){for(var i=1;i<arguments.length;i++){var child=arguments[i];if(child!==null&&child!==undefined)parent.appendChild(typeof child==='string'?document.createTextNode(child):child);}return parent;}
    function button(text,cls,fn){var x=n('button','btn '+(cls||''),text);x.type='button';x.addEventListener('click',fn);return x;}
    function safeUrl(value){try{var u=new URL(value);return (u.protocol==='https:'||u.protocol==='http:')&&!u.username&&!u.password?u.href:'';}catch(e){return '';}}

    function link(text,url,cls){if(hideSourceLink(url))return n('div',cls,text);var x=n('a',cls,text);var safe=safeUrl(url);if(safe){x.href=safe;x.target='_blank';x.rel='noopener noreferrer';}else{x.removeAttribute('href');}return x;}
    function clone(value){return JSON.parse(JSON.stringify(value));}
    function obj(){return Object.create(null);}

    function string(v,max,required){if(typeof v!=='string'||v.length>max||(required&&!v.trim()))throw new Error('문자열 형식이 올바르지 않습니다.');return v;}
    function safeKey(v){return typeof v==='string'&&/^[a-zA-Z0-9][a-zA-Z0-9_-]{0,119}$/.test(v)&&['constructor','prototype','__proto__'].indexOf(v)===-1;}
