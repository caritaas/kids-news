  <script type="application/json" id="week-data">{"weekId":"2026-11-06","rangeLabel":"2026년 11월 2~6일","tracks":[{"id":"g3","grade":3,"paper":"어린이동아","label":"3학년","articles":[{"id":"d1","title":"800년 전 고려 배 ‘마도 5호선’ 충남 태안 바다에서 발견!","date":"2026-11-06","url":"https://kids.donga.com/news/articleView.html?idxno=170235","summary":"충남 태안 앞바다에서 고려시대에 물건을 나르던 마도 5호선이 발견됐어요. 배와 함께 나온 목간은 나무로 된 물건 꼬리표예요. 물건을 보낸 곳과 받는 사람, 물건 종류를 적어 오늘날 택배 운송장과 비슷한 일을 했지요. 연구진은 목간과 다른 유물을 살펴 배가 다닌 때와 화물의 목적지를 알아냈어요. 작은 기록도 옛사람의 생활을 밝히는 단서가 돼요.","keywords":[{"word":"목간","meaning":"글씨를 적은 나무 조각. 이 기사에서는 물건에 단 꼬리표예요."},{"word":"발굴","meaning":"땅이나 물속에 묻힌 옛 물건을 찾아냄"}]},{"id":"d2","title":"옷을 누르면 영상이 짠! 화면으로 변신한 옷감","date":"2026-11-05","url":"https://kids.donga.com/news/articleView.html?idxno=170227","summary":"싱가포르 연구진이 누르면 작동하는 화면을 옷감으로 만들었어요. 비밀은 작은 전자 부품이 들어간 실이에요. 실 속 장치가 빛을 내고 접촉을 알아채요. 화면에서 영상을 보거나 계산기를 쓸 수 있고, 부드럽게 구부릴 수도 있어요. 세탁 뒤에도 작동했어요. 화면을 더 또렷하게 하고 AI를 더하는 일은 앞으로의 계획이에요.","keywords":[{"word":"감지","meaning":"어떤 변화나 움직임이 있음을 알아챔"},{"word":"터치스크린","meaning":"손가락 등으로 눌러 조작하는 화면"}]},{"id":"d3","title":"비행기가 하늘에 그린 이탈리아 국기","date":"2026-11-06","url":"https://kids.donga.com/news/articleView.html?idxno=170233","summary":"11월 4일 이탈리아 로마의 기념행사에서 특별한 비행이 펼쳐졌어요. 여러 비행기가 자리를 맞추어 날며 초록·흰색·빨간 연기를 내보냈어요. 이탈리아 국기에 있는 세 가지 색이지요. 비행팀 이름인 프레체 트리콜로리는 ‘삼색 화살’이라는 뜻이에요. 이날은 나라를 위해 애쓴 군인들을 기억하는 날이에요. 비행 공연도 나라의 상징과 기념일의 뜻을 전할 수 있어요.","keywords":[{"word":"대형","meaning":"여러 사람이나 물체가 일정한 자리에 놓여 만든 모양"},{"word":"기리다","meaning":"훌륭한 일이나 사람을 기억하며 높이 여김"}]}],"questions":[{"id":"g3q1","articleId":"d1","type":"mcq","skill":"내용 이해","prompt":"목간과 택배 운송장이 비슷한 까닭은 무엇인가요?","options":["배의 속도를 높여 줘서","물건을 보내는 데 필요한 정보를 적어서","물건을 따뜻하게 해 줘서","바닷물을 막아 줘서"],"answer":1,"explanation":"목간에는 보낸 곳과 받는 사람 등 화물 정보가 적혀 있었어요."},{"id":"g3q2","articleId":"d1","type":"mcq","skill":"어휘 이해","prompt":"‘발굴’에 해당하는 일은 무엇인가요?","options":["새 배를 설계하기","배 이름을 짓기","오늘의 날씨 적기","물속에 묻힌 옛 물건 찾아내기"],"answer":3,"explanation":"묻혀 있던 옛 물건을 찾는 일이에요."},{"id":"g3q3","articleId":"d1","type":"written","skill":"이유 설명","prompt":"작은 목간이 왜 중요한지, 알아낼 수 있는 정보 한 가지를 넣어 쓰세요.","sampleAnswer":"물건의 목적지를 알아낼 수 있어요. 그래서 옛사람이 물건을 나르던 방법을 이해하는 데 도움이 돼요.","rubric":["목간으로 알 수 있는 정보를 썼나요?","옛 생활을 알아보는 데 도움이 됨을 설명했나요?"]},{"id":"g3q4","articleId":"d2","type":"mcq","skill":"내용 이해","prompt":"화면이 되는 옷감의 비밀은 어디에 있나요?","options":["전자 부품을 넣은 실","종이로 만든 단추","옷 위에 놓은 책","옷을 담는 상자"],"answer":0,"explanation":"특수한 실 속 장치가 빛을 내고 접촉을 알아채요."},{"id":"g3q5","articleId":"d2","type":"mcq","skill":"사실과 계획","prompt":"이미 해 본 일이 아니라 앞으로 할 계획은 무엇인가요?","options":["옷감 구부리기","화면으로 영상 보기","AI 기능 더하기","세탁 뒤 기능 확인하기"],"answer":2,"explanation":"AI를 추가하는 일은 앞으로의 계획이라고 했어요."},{"id":"g3q6","articleId":"d2","type":"written","skill":"생각과 근거","prompt":"이 옷감을 어떤 때 쓰고 싶나요? 요약에 나온 기능을 넣어 쓰세요.","sampleAnswer":"물건 값을 더할 때 쓰고 싶어요. 옷의 화면에서 계산기를 쓸 수 있기 때문이에요.","rubric":["쓰고 싶은 상황을 정했나요?","소개된 기능과 연결했나요? 타당한 다른 생각도 인정해요."]},{"id":"g3q7","articleId":"d3","type":"mcq","skill":"내용 이해","prompt":"비행기가 세 가지 색 연기를 내보낸 까닭으로 알맞은 것은 무엇인가요?","options":["비가 올 것을 알려 주려고","이탈리아 국기의 색을 보여 주려고","바닷속 배를 찾으려고","비행기를 보이지 않게 하려고"],"answer":1,"explanation":"초록·흰색·빨강은 이탈리아 국기의 색이에요."},{"id":"g3q8","articleId":"d3","type":"mcq","skill":"어휘 이해","prompt":"‘대형을 맞춘다’는 뜻과 가장 가까운 것은 무엇인가요?","options":["비행기 크기를 키운다","아무 방향으로 흩어진다","땅에 내려 멈춘다","정해진 자리에 맞추어 모양을 만든다"],"answer":3,"explanation":"여러 비행기가 자리를 맞추어 함께 나는 모습이에요."},{"id":"g3q9","articleId":"d3","type":"written","skill":"핵심 정리","prompt":"이 공연이 무엇을 기념했는지 한 문장으로 쓰세요.","sampleAnswer":"나라를 위해 애쓴 군인들을 기억하는 날을 기념했어요.","rubric":["기념하는 대상을 밝혔나요?","기억하거나 높이 여긴다는 뜻을 담았나요?"]},{"id":"g3q10","type":"written","skill":"배움 돌아보기","prompt":"세 기사 중 하나를 골라 새로 배운 점과 더 궁금한 점을 하나씩 쓰세요.","sampleAnswer":"옷감 기사에서 실이 화면을 만들 수 있다는 점을 배웠어요. 이런 옷의 무게도 궁금해요.","rubric":["어느 기사를 골랐는지 알 수 있나요?","배운 내용은 정확하고, 궁금한 점은 기사와 관련 있나요? 다른 질문도 인정해요."]}]},{"id":"g5","grade":5,"paper":"어린이조선일보","label":"5학년","articles":[{"id":"c1","title":"50년 만에 자동차 사라지는 잠수교 전쟁 나면 탱크 다니는 군사작전용 다리였대요","date":"2026-11-05","url":"https://www.chosun.com/kid/kid_history/2026/11/05/YOPG3AJZ5VCS5CI2SWZ2EU2YFM/","summary":"서울 잠수교는 1976년, 비상시 시민과 군 장비가 강을 건너도록 만들어졌어요. 무거운 장비가 이동하기 쉽도록 경사를 완만하게 했지요. 기둥도 촘촘히 세워 일부가 부서져도 임시 다리판을 얹어 복구하기 쉽게 했어요. 이제 서울시는 자동차 통행을 막고, 2027년까지 사람들이 걷고 문화를 즐길 공간으로 바꾸는 공사를 진행하고 있어요. 다리가 맡는 역할이 시대에 따라 달라지는 사례예요.","keywords":[{"word":"보행","meaning":"발로 걸어 다님"},{"word":"복구","meaning":"손상된 것을 고쳐 원래처럼 쓸 수 있게 함"}]},{"id":"c2","title":"영화 '스파이더맨' 악당처럼, 하늘 나는 스케이트보드 등장!","date":"2026-11-05","url":"https://www.chosun.com/kid/kid_science/2026/11/05/OANDIXB6PFE4HMQQ2WZOYT2PDU/","summary":"중국의 한 청년이 영화에서 아이디어를 얻어 비행 스케이트보드를 만들었어요. 모터로 회전 날개를 돌려 공기를 아래로 밀면, 공기가 보드를 위로 미는 힘이 생겨요. 물체 사이에 반대 방향의 힘이 함께 작용하는 원리이지요. 위로 미는 힘이 중력보다 크면 올라가요. 기울기를 측정해 자세를 조절하는 장치도 달았어요. 기사는 접근하기 어려운 장소의 구조 활동에 활용할 가능성을 소개하지만, 구조 현장에 이미 널리 보급됐다는 뜻은 아니에요.","keywords":[{"word":"중력","meaning":"지구가 물체를 지구 중심 쪽으로 끌어당기는 힘"},{"word":"활용","meaning":"어떤 일을 하는 데 알맞게 이용함"}]},{"id":"c3","title":"냉장고까지 해킹하는 세상… 유럽 수퍼마켓 발칵","date":"2026-11-05","url":"https://www.chosun.com/kid/kid_nie/kid_lower-grades/2026/11/05/EOTDTO7AFJHJNGL7XJO4DSSXLE/","summary":"유럽 여러 수퍼마켓에서 냉장 시설의 온도가 갑자기 올라갔어요. 인터넷으로 연결된 시설을 누군가 공격한 것으로 추정돼요. 얼음을 녹이려고 냉각을 잠시 멈추는 기능이 원격으로 강제 작동된 것으로 알려졌지요. 직원들은 식품을 다른 곳으로 옮겼지만, 상한 식품은 버려야 했어요. 기업에도 금전적 피해가 생겼어요. 이 사건은 인터넷에 연결된 생활 장비에도 보안이 필요함을 보여 줘요. 추정된 공격 원인과 실제 발생한 피해를 구별해 읽어 보세요.","keywords":[{"word":"원격","meaning":"멀리 떨어진 곳에서 조종하거나 통신하는 것과 관련됨"},{"word":"추정","meaning":"확인된 단서를 바탕으로 그러할 것이라고 판단함"}]}],"questions":[{"id":"g5q1","articleId":"c1","type":"mcq","skill":"요약","prompt":"잠수교 기사의 핵심으로 알맞은 것은 무엇인가요?","options":["새 군사용 다리의 설계 경쟁","비상 이동 통로에서 보행·문화 공간으로의 변화","모든 한강 다리의 철거 계획","자동차 통행량을 늘리는 공사"],"answer":1,"explanation":"과거의 건설 목적과 현재의 공간 전환을 함께 담은 요약이에요."},{"id":"g5q2","articleId":"c1","type":"mcq","skill":"원인과 결과","prompt":"기둥을 촘촘하게 세운 목적은 무엇인가요?","options":["손상된 부분에 임시 다리판을 얹기 쉽게 하려고","강물을 완전히 막으려고","다리의 경사를 가파르게 하려고","문화 공연을 금지하려고"],"answer":0,"explanation":"임시 다리판을 얹어 빨리 복구하려는 구조예요."},{"id":"g5q3","articleId":"c1","type":"written","skill":"근거 있는 의견","prompt":"잠수교의 새 공간에 필요한 시설 하나를 제안하고 이유를 두세 문장으로 쓰세요.","sampleAnswer":"쉬어 갈 벤치를 제안해요. 사람들이 걷는 공간으로 바뀌므로 오래 걷기 힘든 사람도 쉴 곳이 필요해요.","rubric":["시설을 구체적으로 제안했나요?","보행·문화 공간이라는 변화와 이유를 연결했나요? 다른 타당한 제안도 인정해요."]},{"id":"g5q4","articleId":"c2","type":"mcq","skill":"과정 이해","prompt":"보드를 위로 움직이게 하는 과정을 바르게 연결한 것은 무엇인가요?","options":["공기를 위로 밀기 → 중력 증가","중력 제거 → 회전 날개 정지","기울기 측정 → 공기 사라짐","날개가 공기를 아래로 밀기 → 공기가 보드를 위로 밀기"],"answer":3,"explanation":"공기와 보드 사이에 반대 방향의 힘이 작용해요."},{"id":"g5q5","articleId":"c2","type":"mcq","skill":"정보 구분","prompt":"요약을 근거로 할 수 있는 말은 무엇인가요?","options":["모든 구조대가 이미 사용한다.","기울기 조절 장치는 필요 없다.","구조 활동에 쓸 가능성이 소개됐다.","중력은 완전히 없어졌다."],"answer":2,"explanation":"활용 가능성과 널리 사용한다는 사실은 구별해야 해요."},{"id":"g5q6","articleId":"c2","type":"written","skill":"인과 설명","prompt":"보드가 올라가는 까닭을 공기의 움직임과 중력을 넣어 설명하세요.","sampleAnswer":"회전 날개가 공기를 아래로 밀면 공기가 보드를 위로 밀어요. 이 힘이 중력보다 크면 올라가요.","rubric":["공기를 미는 방향과 보드가 받는 힘의 방향을 구별했나요?","위로 미는 힘과 중력의 크기를 비교했나요?"]},{"id":"g5q7","articleId":"c3","type":"mcq","skill":"원인과 결과","prompt":"기업이 금전적 피해를 본 이유로 알맞은 것은 무엇인가요?","options":["상한 식품을 팔지 못하고 버렸기 때문에","온도가 내려가 식품이 모두 늘었기 때문에","모든 냉장고를 새로 발명했기 때문에","직원들이 인터넷 사용료를 받았기 때문에"],"answer":0,"explanation":"보관 온도 상승이 식품 손상과 손실로 이어졌어요."},{"id":"g5q8","articleId":"c3","type":"mcq","skill":"사실과 의견","prompt":"다음 문장 중 중요성을 평가한 의견은 무엇인가요?","options":["매장 냉장 시설의 온도가 올랐다.","보안 교육은 어떤 교육보다 중요하다.","직원들이 식품을 옮겼다.","상한 식품을 버렸다."],"answer":1,"explanation":"중요성을 비교한 평가는 의견이에요. 나머지는 요약에 나온 일이에요."},{"id":"g5q9","articleId":"c3","type":"written","skill":"내용과 추정 구분","prompt":"확인된 피해 하나와 추정된 원인 하나를 구별해 쓰세요.","sampleAnswer":"상한 식품이 버려진 것은 발생한 피해예요. 인터넷을 통한 공격이 원인이라는 설명은 추정이에요.","rubric":["실제 피해를 정확히 골랐나요?","공격 원인을 확정된 사실처럼 단정하지 않았나요?"]},{"id":"g5q10","type":"written","skill":"기사 연결","prompt":"세 기사 중 하나를 골라 ‘사람의 안전을 위해 무엇을 살펴야 할까?’에 답하세요. 기사 근거와 자신의 생각을 나눠 세 문장 안팎으로 쓰세요.","sampleAnswer":"잠수교 기사에는 사람들이 걷는 공간으로 바꾼다고 나와요. 나는 미끄러지지 않는 바닥이 필요하다고 생각해요. 안전하게 걸어야 하기 때문이에요.","rubric":["기사에서 확인한 근거를 정확히 썼나요?","자신의 제안과 이유를 근거에 연결했나요? 세 기사 중 어떤 기사를 골라도 타당하면 인정해요."]}]}]}</script>
